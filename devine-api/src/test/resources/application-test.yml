# ===========================================
# Test Profile (API)
# ===========================================

server:
  port: 0

spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    clean-disabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://test-issuer.local"

# Logging
logging:
  level:
    root: INFO
    com.umc.devine: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

clerk:
  secret-key: "test-secret-key-for-integration-tests"
  issuer-uri: "https://test-issuer.local"

# 외부 연동 헬스체크
# 스케줄러를 끄지 않으면 CI가 실제 외부 API(Clerk, GitHub, OpenAI 등)를 호출하게 된다.
integration:
  health:
    enabled: false
    connect-timeout: 500
    read-timeout: 500

# Thread Pool Configuration
executor:
  async:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100

# Redis Channel
redis:
  channel:
    notification-prefix: "notification:user:"
    notification-pattern: "notification:user:*"
