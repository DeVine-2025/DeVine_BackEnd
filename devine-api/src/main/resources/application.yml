spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "classpath:core-defaults.yml"
  profiles:
    active: ${SPRING_PROFILE_ACTIVE:dev}
  application:
    name: DeVine-API

  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_POOL_SIZE:15}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:2000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:240000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:120000}
      minimum-idle: ${HIKARI_MIN_IDLE:3}

  flyway:
    enabled: true

  # AWS S3
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}
      s3:
        bucket: ${AWS_S3_BUCKET:}
      region:
        static: ap-northeast-2
      cloudfront:
        domain: ${AWS_CLOUDFRONT_DOMAIN:}

# Server
server:
  port: ${API_PORT:8080}

# Clerk
clerk:
  secret-key: ${CLERK_SECRET_KEY:}
  issuer-uri: ${CLERK_ISSUER_URI:}

# GitHub
github:
  service-token: ${GITHUB_SERVICE_TOKEN:}
  # 회원 탈퇴 시 GitHub OAuth 권한 회수용. Clerk에 연결된 GitHub OAuth 앱의 값(Clerk Dashboard → SSO connections → GitHub).
  # 비어 있으면 권한 회수를 건너뛴다.
  oauth:
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}

# 회원 탈퇴
withdrawal:
  # 탈퇴 환불 신청 알림, 외부 정리 최종 실패 알림을 받는 운영자 메일
  operator-email: ${WITHDRAWAL_OPERATOR_EMAIL:projectdevine2025@gmail.com}
  # 정지/소명 중 탈퇴자의 이메일 해시, 사유, 제재 이력을 1년 보관하고 재가입을 막는다.
  # 개인정보처리방침 개정안 시행 후 대표 요청이 있을 때만 켠다. 켜려면 email-hash-pepper가 필요하다.
  retain-sanctioned-member: ${WITHDRAWAL_RETAIN_SANCTIONED_MEMBER:false}
  # 이메일 해시 비밀값. 한 번 정하면 바꾸지 않는다(바꾸면 기존 해시와 대조할 수 없다)
  email-hash-pepper: ${WITHDRAWAL_EMAIL_HASH_PEPPER:}

# 커밋 뒤 외부 작업 아웃박스
outbox:
  poll-interval: ${OUTBOX_POLL_INTERVAL:60000}
  initial-delay: ${OUTBOX_INITIAL_DELAY:30000}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  # 재시도 한도. 넘으면 FAILED로 남기고 운영자에게 알린다. 간격은 1분부터 2배씩, 최대 6시간
  max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}

# 이메일 발송: Brevo API 키 > SMTP 계정 > Console 순으로 사용
brevo:
  api-key: ${BREVO_API_KEY:}
  from-email: ${BREVO_FROM_EMAIL:noreply@devine.com}
  from-name: ${BREVO_FROM_NAME:DeVine}

smtp:
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  user: ${SMTP_USER:}
  pass: ${SMTP_PASS:}
  from: ${SMTP_FROM:noreply@devine.com}
  from-name: ${SMTP_FROM_NAME:DeVine}

# Gemini / OpenAI (FastAPI AI 워커와 공유하는 .env 값. 헬스체크 프로브 전용으로만 사용)
gemini:
  api-key: ${GEMINI_API_KEY:}

openai:
  api-key: ${OPENAI_API_KEY:}

# 외부 연동 헬스체크
integration:
  health:
    interval: ${INTEGRATION_HEALTH_INTERVAL:300000}
    initial-delay: ${INTEGRATION_HEALTH_INITIAL_DELAY:60000}
    connect-timeout: ${INTEGRATION_HEALTH_CONNECT_TIMEOUT:2000}
    read-timeout: ${INTEGRATION_HEALTH_READ_TIMEOUT:3000}
    warn-threshold: ${INTEGRATION_HEALTH_WARN_THRESHOLD:1000}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Admin (관리자 인증/인가)
# bootstrap-clerk-ids: 최초 관리자 부트스트랩용 Clerk user id(user_xxx) 목록(콤마 구분).
#   이 clerk_id로 처음 /admin 접근 시 admin 테이블에 자동 등록된다.
#   판정은 clerk_id(sub, 위조 불가)만 신뢰하므로 Clerk 세션 토큰 커스터마이즈(email 등)는 관리자용으론 불필요하다.
#   최초 관리자의 user id 확보: 로그인 후 /admin 접근 시 403 감사 로그의 clerkId, 또는 Clerk Dashboard → Users → User ID.
#   운영 주의(회수): 관리자를 회수(is_active=false)할 때는 이 목록에서도 해당 clerk_id를 반드시 제거한다.
#     목록에 남아 있어도 회수 우선 정책상 재활성화되지는 않지만, 목록 정리가 부트스트랩 백도어를 최소화한다.
admin:
  bootstrap-clerk-ids: ${ADMIN_BOOTSTRAP_CLERK_IDS:}

# PortOne
portone:
  store-id: ${PORTONE_STORE_ID:}
  api-secret: ${PORTONE_API_SECRET:}
  base-url: https://api.portone.io
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
  channel-key:
    nhn-kcp: ${PORTONE_CHANNEL_KEY_NHN_KCP:}
    kg-inicis: ${PORTONE_CHANNEL_KEY_KG_INICIS:}
    kakaopay: ${PORTONE_CHANNEL_KEY_KAKAOPAY:}
    toss-payments: ${PORTONE_CHANNEL_KEY_TOSS_PAYMENTS:}

# Credit
devine:
  credit:
    initial-count: ${DEVINE_CREDIT_INITIAL_COUNT:1}

complaint:
  evidence:
    enabled: ${COMPLAINT_EVIDENCE_ENABLED:false}
