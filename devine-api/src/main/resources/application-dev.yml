# ===========================================
# Development Profile
# ===========================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate

# Logging
logging:
  level:
    root: INFO
    com.umc.devine: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: DEBUG

# Thread Pool Configuration
executor:
  async:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100

# FastAPI (prod 프로파일에만 선언돼 있어 dev에서는 헬스체크가 대상 URL을 못 찾는다)
fastapi:
  callback:
    base-url: ${FASTAPI_CALLBACK_URL:http://localhost:8080}
  report:
    base-url: ${FASTAPI_URL:http://localhost:8000}
