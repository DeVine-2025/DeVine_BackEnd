# ===========================================
# Test Profile (Realtime)
# ===========================================

server:
  port: 0

spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    # 운영에서는 devine-api가 마이그레이션을 소유하므로 realtime은 flyway를 끈다.
    # 다만 테스트는 자기 스키마를 스스로 준비해야 한다. 끄면 다른 모듈의 테스트가
    # 먼저 실행돼 테이블을 만들어 주기를 기대하게 되어 실행 순서에 의존하게 된다.
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://test-issuer.local"

# Logging
logging:
  level:
    root: INFO
    com.umc.devine: DEBUG

# SSE Configuration
sse:
  timeout: 3600000
  heartbeat-rate: 30000

# Thread Pool Configuration
executor:
  async:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100
  sse-connection:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 25
  sse-dispatch:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 50
