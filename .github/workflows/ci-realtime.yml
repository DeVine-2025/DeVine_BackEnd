name: CI - Realtime

on:
  workflow_dispatch:
  push:
    branches: [ main, qa ]
    paths:
      - 'devine-realtime/**'
      - 'devine-core/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/ci-realtime.yml'
      - '.github/workflows/cd-realtime.yml'
      - '.github/actions/ci-build/**'

jobs:
  test-and-build:
    # qa(개발환경, OCI ARM) 빌드는 ARM 네이티브 러너에서 arm64 이미지 생성.
    # main(운영, EC2 x86)은 기존 그대로.
    runs-on: ${{ github.ref_name == 'qa' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-build
        with:
          module: devine-realtime
          test-modules: ':devine-core:test :devine-realtime:test'
          docker-image-name: devine-realtime
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
