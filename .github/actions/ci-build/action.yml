name: CI Build & Push
description: Test, build, and push Docker image for a module

inputs:
  module:
    description: 'Module name (e.g. devine-api, devine-realtime)'
    required: true
  test-modules:
    description: 'Gradle test targets (e.g. :devine-core:test :devine-api:test)'
    required: true
  docker-image-name:
    description: 'Docker image name (e.g. devine-api)'
    required: true
  docker-username:
    description: 'Docker Hub username'
    required: true
  docker-password:
    description: 'Docker Hub password'
    required: true

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew

    - name: Run tests
      shell: bash
      run: ./gradlew ${{ inputs.test-modules }} --no-daemon
      env:
        SPRING_PROFILES_ACTIVE: test

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}

    - name: Determine tags
      id: tags
      shell: bash
      run: |
        IMAGE="${{ inputs.docker-username }}/${{ inputs.docker-image-name }}"
        REF="${GITHUB_REF_NAME}"
        SHA="${GITHUB_SHA}"
        if [ "$REF" = "main" ]; then
          echo "tags=${IMAGE}:${SHA},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
        elif [ "$REF" = "qa" ]; then
          echo "tags=${IMAGE}:qa-${SHA},${IMAGE}:qa-latest" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ inputs.module }}/Dockerfile
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
